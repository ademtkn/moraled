<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MoralEd</title>
  <script>
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    const redirectUrl =
      '/?redirect=' +
      encodeURIComponent(path + search + hash);

    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
